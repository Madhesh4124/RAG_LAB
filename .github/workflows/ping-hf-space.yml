name: Keep HuggingFace Space Awake

on:
  schedule:
    # Run every 6 hours to ensure the HF Space container never idles out
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-space:
    name: Ping HF Space Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Liveness Endpoint
        env:
          HF_SPACE_URL: ${{ vars.HF_SPACE_URL }}
          HF_SPACE_PING_PATH: ${{ vars.HF_SPACE_PING_PATH }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          url="${HF_SPACE_URL:-https://madhesh4124-rag-backend.hf.space}"
          path="${HF_SPACE_PING_PATH:-/health}"
          full_url="${url%/}${path}"

          auth_args=()
          if [[ -n "${HF_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer ${HF_TOKEN}")
            echo "Pinging ${full_url} with token authentication..."
          else
            echo "Pinging ${full_url} without token authentication..."
          fi

          # Allow up to 90s max-time to accommodate cold-starts if the space was asleep
          code=$(curl --show-error --silent --location \
            --retry 3 --retry-delay 10 --max-time 90 \
            -A "RAGLab-KeepAlive-Bot/1.0" \
            "${auth_args[@]}" \
            --output /dev/null --write-out "%{http_code}" \
            "${full_url}")

          echo "HTTP response status: ${code}"

          if [[ "${code}" =~ ^[23] ]]; then
            echo "Successfully pinged HF Space! Backend is active."
            exit 0
          fi

          if [[ -z "${HF_TOKEN:-}" && ( "${code}" == "401" || "${code}" == "403" ) ]]; then
            echo "Space is gated or private, but server responded; treating as successful ping."
            exit 0
          fi

          echo "Error: Ping failed with status ${code}"
          exit 1
