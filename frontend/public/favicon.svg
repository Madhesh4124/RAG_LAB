<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="3" />

  <!-- Background Subtle Grid / Vector Rays -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.4" />

  <!-- Microscope / RAG Lens Symbol -->
  <g transform="translate(10, 8)" filter="url(#softGlow)">
    <!-- Stand / Base -->
    <path d="M 32 94 L 76 94 A 4 4 0 0 1 80 98 L 80 100 A 3 3 0 0 1 77 103 L 31 103 A 3 3 0 0 1 28 100 L 28 98 A 4 4 0 0 1 32 94 Z" fill="url(#primaryGrad)" />
    <!-- Stage Plate -->
    <rect x="36" y="75" width="36" height="5" rx="2.5" fill="#94a3b8" />
    <circle cx="54" cy="77.5" r="2.5" fill="#38bdf8" />

    <!-- Curved Arm -->
    <path d="M 68 94 C 84 94 92 82 92 64 C 92 48 83 38 72 37" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Optical Tube (Angled 32 deg) -->
    <g transform="rotate(-30 48 48)">
      <!-- Eyepiece -->
      <rect x="42" y="10" width="12" height="6" rx="2" fill="#38bdf8" />
      <!-- Eyepiece tube -->
      <rect x="44" y="16" width="8" height="12" fill="#cbd5e1" />
      <!-- Main body barrel -->
      <rect x="41" y="28" width="14" height="26" rx="3" fill="url(#primaryGrad)" />
      <!-- Objective Revolving Nosepiece -->
      <polygon points="41,54 55,54 52,62 44,62" fill="#94a3b8" />
      <!-- Objective lens -->
      <rect x="45.5" y="62" width="5" height="8" rx="1.5" fill="#38bdf8" />
      
      <!-- Focused Laser / Data Beam -->
      <line x1="48" y1="70" x2="48" y2="82" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 2" />
    </g>

    <!-- Neural / Data Nodes -->
    <circle cx="28" cy="40" r="4.5" fill="#38bdf8" />
    <circle cx="22" cy="62" r="3.5" fill="#818cf8" />
    <circle cx="38" cy="24" r="3" fill="#c084fc" />
    <line x1="28" y1="40" x2="22" y2="62" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="28" y1="40" x2="38" y2="24" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" />
  </g>
</svg>